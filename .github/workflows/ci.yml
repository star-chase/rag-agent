name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "5432"
      TEST_DB_USER: rag
      TEST_DB_PASSWORD: rag

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Start Postgres with pg_jieba
        run: |
          docker compose build postgres
          docker compose up -d postgres
          # api/worker/init 声明了 env_file: .env，仓库不提交这个文件。
          # docker compose exec/logs 会校验全部服务，文件不存在就直接失败，
          # 所以健康检查改走容器名，不经过 compose。
          for _ in $(seq 1 40); do
            if docker exec rag-agent-postgres-1 pg_isready -U rag -d rag_agent; then
              exit 0
            fi
            sleep 3
          done
          docker logs rag-agent-postgres-1 || true
          exit 1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app tests evals

      - name: Check demo frontend syntax
        run: node --check app/static/app.js

      - name: Run tests
        run: python -m pytest -v

      - name: Check MCP server（工具 schema 自检）
        run: python -m app.mcp.server --list-tools > /dev/null

      - name: Run evals（检索质量评测）
        run: python -m evals.run_evals --check --report evals/report.md

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/report.md

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t rag-agent .
